workflows:
  ios-cloud-build:
    name: TaungThuEain iOS Cloud Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        APP_ID: com.taungthar.yieldcalculator
      node: 22
      xcode: latest
    scripts:
      - name: Install Node dependencies
        script: npm install
      - name: Add iOS platform if missing
        script: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
      - name: Sync web assets to iOS
        script: npx cap sync ios
      - name: Build iOS archive (unsigned workflow setup)
        script: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/**/*.app
